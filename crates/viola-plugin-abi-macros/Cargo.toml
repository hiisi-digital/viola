[package]
name = "viola-plugin-abi-macros"
version = "0.1.0"
edition = "2024"
description = "Proc-macro companion to viola-plugin-abi (#[export_plugin], #[capability])"
license = "MPL-2.0"
repository = "https://github.com/orgrinrt/viola"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
viola-plugin-abi = { path = "../viola-plugin-abi" }
