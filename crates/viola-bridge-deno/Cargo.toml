[package]
name = "viola-bridge-deno"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Viola lint plugin that embeds a deno_core JsRuntime and bridges TS lint logic into the v1 plugin ABI. Self-contained cdylib; no external deno binary required."
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
viola-plugin-abi = { path = "../viola-plugin-abi" }
hilavitkutin-extensions.workspace = true
hilavitkutin-extensions-macros.workspace = true
arvo.workspace = true
notko.workspace = true
deno_core = "0.399"
deno_ast = { version = "0.53", features = ["transpiling"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
