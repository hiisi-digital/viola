# External lint packs (mockspace #94 feature)
# ---------------------------------------------------------------------------

[lint-crates]
mockspace-hilavitkutin-stack-lints = { git = "ssh://git@github.com/orgrinrt/mockspace-hilavitkutin-stack-lints.git", branch = "dev" }
