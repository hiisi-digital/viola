[workspace]
resolver = "2"
members = [
    "crates/viola-deno-runtime",
    "crates/viola-cli",
    "crates/viola-config",
    "crates/viola-core",
    "crates/viola-plugin-abi",
    "crates/viola-test-plugin-fixture",
    "crates/viola-test-runner-fixture",
]
default-members = [
    "crates/viola-cli",
    "crates/viola-config",
    "crates/viola-core",
    "crates/viola-plugin-abi",
    "crates/viola-deno-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/hiisi-digital/viola"
homepage = "https://github.com/hiisi-digital/viola"
description = "Linter and diagnostic engine: in-process Rust host runtime with stable plugin ABI plus optional Deno bridge for TypeScript plugins."
keywords = ["linter", "plugin-host", "diagnostics", "static-analysis", "deno"]
categories = ["development-tools", "command-line-utilities"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace.dependencies]
# Hilavitkutin foundations. Canonical refs are git; local iteration uses
# the path-overrides in the [patch."..."] section below.
hilavitkutin = { git = "ssh://git@github.com/orgrinrt/hilavitkutin.git", branch = "dev", default-features = false }
hilavitkutin-linking = { git = "ssh://git@github.com/orgrinrt/hilavitkutin.git", branch = "dev", default-features = false }
hilavitkutin-extensions = { git = "ssh://git@github.com/orgrinrt/hilavitkutin.git", branch = "dev", default-features = false }
hilavitkutin-extensions-macros = { git = "ssh://git@github.com/orgrinrt/hilavitkutin.git", branch = "dev", default-features = false }
hilavitkutin-api = { git = "ssh://git@github.com/orgrinrt/hilavitkutin.git", branch = "dev", default-features = false }
hilavitkutin-str = { git = "ssh://git@github.com/orgrinrt/hilavitkutin.git", branch = "dev", default-features = false }

notko = { git = "ssh://git@github.com/orgrinrt/notko.git", branch = "dev", default-features = false }
arvo = { git = "ssh://git@github.com/orgrinrt/arvo.git", branch = "dev", default-features = false }
