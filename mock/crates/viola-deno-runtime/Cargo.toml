[package]
name = "viola-deno-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Viola plugin that runs TS lint projects through a long-lived sibling deno worker process and bridges results into the v1 plugin ABI."
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
viola-plugin-abi = { path = "../viola-plugin-abi" }
hilavitkutin-extensions.workspace = true
hilavitkutin-extensions-macros.workspace = true
arvo.workspace = true
notko.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
